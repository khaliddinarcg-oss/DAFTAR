<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0c0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Direction: the scooter itself. Anodised anthracite body, one stop-light accent, a handlebar LED display as the hero,
   battery cells for progress, chamfered "diamond-cut" controls, light strips on the card edges. Single dark world by choice. */
:root{
  color-scheme:dark;
  --bg:#0b0c0e;        /* deck, matte black */
  --surface:#16181c;   /* anodised aluminium */
  --raised:#22252b;    /* controls */
  --ink:#f3f5f6;       /* headlight white */
  --muted:#9aa2aa;
  --line:#2c3037;
  --accent:#ff4b26;    /* stop light: brand, active tab, late */
  --led:#8fe9ff;       /* display backlight */
  --warn:#ffb020;      /* indicator amber */
  --ok:#35e08c;        /* eco mode green */
  --display:"Chakra Petch","Eurostile","Trebuchet MS",sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --cut:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
  --slant:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:radial-gradient(rgba(255,255,255,.045) 1px,transparent 1.2px);background-size:7px 7px;
  color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding:18px 16px 100px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
h1::before{content:"";width:10px;height:26px;background:var(--accent);transform:skewX(-14deg);box-shadow:0 0 14px rgba(255,75,38,.7)}
h2{font-family:var(--display);font-style:italic;font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:12px;margin:4px 0 0;letter-spacing:.12em;text-transform:uppercase}
.chip,.pill{font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 13px;white-space:nowrap;clip-path:var(--slant);background:var(--raised);color:var(--ink)}
.chip{background:var(--warn);color:#201500}
.pill.bad{background:var(--accent);color:#fff}
.pill.warn{background:var(--warn);color:#201500}
.pill.ok{background:rgba(53,224,140,.16);color:var(--ok)}

/* handlebar display */
.dash{position:relative;background:linear-gradient(180deg,#050607,#0d1013);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.dash::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;background:linear-gradient(90deg,transparent,var(--led),transparent);animation:sweep 1.4s ease-out 1 both}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.dash-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lbl{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.led{font-family:var(--display);font-style:italic;font-weight:700;font-size:54px;line-height:1;color:var(--led);text-shadow:0 0 18px rgba(143,233,255,.45);white-space:nowrap}
.led small{font-size:16px;margin-left:6px;letter-spacing:.1em;opacity:.8}
.batt{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.cells{display:flex;gap:3px;transform:skewX(-14deg)}
.cells i{width:9px;height:20px;background:var(--line)}
.cells i.on{background:var(--ok);box-shadow:0 0 8px rgba(53,224,140,.6)}
.dash-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:12px}
.dash-row a{color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.dash-row b{font-family:var(--display);font-style:italic;font-size:19px;white-space:nowrap}
.dash-row span{font-size:12px;color:var(--muted)}
.dash-row a.hot b{color:var(--accent);text-shadow:0 0 12px rgba(255,75,38,.5)}

.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:13px;display:flex;flex-direction:column;gap:10px}
.card.bad{border-left-color:var(--accent);box-shadow:-8px 0 18px -10px var(--accent)}
.card.warn{border-left-color:var(--warn);box-shadow:-8px 0 18px -10px var(--warn)}
.card.ok{border-left-color:var(--ok);box-shadow:-8px 0 18px -10px var(--ok)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta b{color:var(--ink)}
.amt{font-family:var(--display);font-style:italic;font-weight:600;font-size:19px;white-space:nowrap}
/* battery-cell progress */
.bar{height:10px;transform:skewX(-14deg);background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 11px)}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--ok) 0 8px,transparent 8px 11px)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,.btn,select,input{font:inherit}
.btn{border:0;background:var(--raised);color:var(--ink);padding:9px 16px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;min-height:40px;clip-path:var(--cut)}
.btn.primary{background:var(--ink);color:#0b0c0e}
.btn.wa{background:rgba(53,224,140,.16);color:var(--ok)}
.btn.link{background:none;color:var(--muted);padding:9px 4px;clip-path:none;font-family:var(--body);font-weight:500;text-transform:none;letter-spacing:0;font-size:14px}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--accent)}
select,input{border:1px solid var(--line);background:#0e1013;color:var(--ink);padding:9px 10px;border-radius:4px;min-height:40px;max-width:100%}
input[type=search],#shop{width:100%}
:focus-visible{outline:2px solid var(--led);outline-offset:2px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:4px}
.foot{color:var(--muted);font-size:13px;margin:0}
nav{position:fixed;left:0;right:0;bottom:0;background:#050607;border-top:1px solid var(--line)}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav a{padding:13px 2px 15px;text-align:center;font-family:var(--display);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-decoration:none;border-top:2px solid transparent;margin-top:-1px}
nav a[aria-current="page"]{color:var(--ink);border-top-color:var(--accent);box-shadow:0 -8px 14px -10px var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet form{background:var(--surface);width:100%;max-width:480px;border-top:2px solid var(--led);border-radius:14px 14px 0 0;padding:18px 16px;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.sheet label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.sheet input,.sheet select{width:100%;font-size:16px}
@media (prefers-reduced-motion:reduce){.dash::before{animation:none}}
nav div{grid-template-columns:repeat(4,1fr)}
nav a{font-size:12px;letter-spacing:.05em}
.subnav{display:flex;gap:6px;flex-wrap:wrap}
.subnav a{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 15px;clip-path:var(--slant);background:var(--raised);color:var(--muted);text-decoration:none}
.subnav a[aria-current="page"]{background:var(--ink);color:#0b0c0e}
.btn.big{min-height:56px;font-size:15px}
.btn.wide{justify-content:center;width:100%}
.qty{min-width:40px;font-size:26px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
details summary{cursor:pointer;color:var(--muted);font-size:14px;padding:4px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-style:italic;font-size:22px;white-space:nowrap}
.kpi span{font-size:12px;color:var(--muted)}
.ticket{background:#fff;color:#111;padding:16px;border-radius:2px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.ticket hr{border:0;border-top:1px dashed #888;width:100%;margin:4px 0}
.t-shop{font-family:var(--display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
.t-c{text-align:center;font-size:13px;color:#444}
.t-line{display:flex;justify-content:space-between;gap:12px}
.t-line span:last-child,.t-line b{text-align:right}
.t-stamp{font-family:var(--display);font-weight:600;text-transform:uppercase;color:#c22a0c;border:2px solid #c22a0c;padding:4px 8px;text-align:center}
.t-qr{align-self:center;width:150px}
.qr{display:block;width:100%;height:auto}
.labs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lab{background:#fff;color:#111;padding:10px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:3px;border-radius:2px;overflow-wrap:anywhere}
.lab b{font-size:13px}
#cam,#pick,#fiche-cam,#fiche-img,#bon-cam,#bon-img{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.dash-row{grid-template-columns:repeat(2,1fr);gap:12px 8px}
.dash-row a.low b{color:var(--warn)}
nav div{grid-template-columns:repeat(5,1fr)}
nav a{font-size:11px;letter-spacing:.02em}
.err{color:var(--accent);font-weight:600;margin:0;border-left:3px solid var(--accent);padding-left:10px}
.pos{color:var(--ok)}.neg{color:var(--accent)}
.kpis.three{grid-template-columns:repeat(3,1fr)}
.kpis.three .kpi b{font-size:16px}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:8px;border-bottom:1px solid var(--line)}
.chart i{flex:1;min-height:2px;background:var(--led);border-radius:2px 2px 0 0;opacity:.85}
.chart i.now{background:var(--accent)}
.chart-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.kpi small{font-size:11px;color:var(--muted)}
.kpi small.up{color:var(--ok)}.kpi small.down{color:var(--accent)}
.rep h3{font-size:12px;margin:6px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.rep .inv-grid{table-layout:fixed}
.rep .inv-grid td:first-child,.rep .inv-grid th:first-child{text-align:left;width:62%}
.rep .inv-grid td.r{text-align:right}
select.full{width:100%}
#logo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.t-logo{max-height:72px;max-width:60%;align-self:center;object-fit:contain}
.logo-prev{height:48px;max-width:120px;object-fit:contain;background:#fff;padding:4px;border-radius:2px}
h1{font-size:24px;gap:10px}
h1::before{display:none}
.brand-logo{height:34px;max-width:140px;object-fit:contain;background:#fff;padding:3px;border-radius:3px}
h1 span{overflow-wrap:anywhere}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;background:#fff;flex:none}
.labs{background:#fff;padding:10px;border-radius:2px}
@media print{
 @page{margin:8mm}
 html,body{background:#fff !important}
 .app,nav,header,#view,#cam,#logo,#fiche-cam,#fiche-img,#bon-cam,#bon-img{display:none !important}
 .sheet{position:static !important;inset:auto !important;background:none !important;display:block !important}
 .sheet[hidden]{display:none !important}
 .sheet form{max-width:none !important;max-height:none !important;overflow:visible !important;border:0 !important;padding:0 !important;background:#fff !important;border-radius:0 !important}
 .sheet form>h2,.sheet .acts,.sheet .meta,.sheet .err{display:none !important}
 #paper{background:#fff !important;color:#111 !important;box-shadow:none !important}
}
.sorts{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;margin:-2px 0 2px}
.sorts button{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:7px 15px;clip-path:var(--slant);background:var(--raised);color:var(--muted);border:0;cursor:pointer;white-space:nowrap;flex:none}
.sorts button[aria-current="page"]{background:var(--ink);color:#0b0c0e}
.thumb.big{width:84px;height:84px}
/* a professional invoice sheet, printed white whatever the app's theme */
.inv{background:#fff;color:#1a1d21;padding:22px 24px;font-size:12px;line-height:1.4;display:flex;flex-direction:column;gap:12px}
.inv-head{text-align:center}
.inv-logo{max-height:70px;max-width:220px;object-fit:contain;display:block;margin:0 auto 4px}
.inv-shop{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.04em;color:var(--ac);text-transform:uppercase;line-height:1.1}
.inv-slogan{font-weight:600;color:var(--ac);font-size:12.5px;margin-top:2px}
.inv-kind{border:1.5px solid #1a1d21;text-align:center;font-weight:700;font-size:17px;letter-spacing:.08em;padding:4px}
.inv-to{align-self:flex-end;min-width:58%;max-width:100%;text-align:center}
.inv-to-lbl{font-weight:700;margin-bottom:2px}
.inv-to-box{border:1.5px solid #1a1d21;padding:6px 10px;font-weight:700;line-height:1.5}
.inv-grid,.inv-t{width:100%;border-collapse:collapse}
.inv-grid th,.inv-grid td{border:1px solid #1a1d21;padding:3px 8px;text-align:center;font-size:11.5px}
.inv-grid th,.inv-t th{font-weight:700;background:#f4f5f6}
.inv-t th{border:1px solid #1a1d21;padding:5px 8px;font-size:11.5px;text-align:center}
.inv-t td{border-left:1px solid #1a1d21;border-right:1px solid #1a1d21;padding:4px 8px;vertical-align:top;height:17px}
.inv-t tbody tr:last-child td{border-bottom:1px solid #1a1d21}
.inv-t .r{text-align:right;white-space:nowrap}
.inv-t .c{text-align:center}
.inv-t .isub{font-size:10.5px;color:#444;margin-top:1px}
.inv-t tfoot td{border:1px solid #1a1d21;font-weight:700;padding:5px 8px}
.inv-sum{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.inv-words{flex:1 1 220px;min-width:0}
.inv-lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#6a7178}
.inv-tot{border-collapse:collapse;min-width:210px}
.inv-tot td{padding:4px 9px}
.inv-tot .r{text-align:right;white-space:nowrap}
.inv-ttc td{border-top:2px solid var(--ac);font-weight:700;font-size:14px}
.inv-sign{align-self:flex-end;text-align:center;min-width:200px;min-height:86px;font-size:11px;font-weight:700;display:flex;flex-direction:column;justify-content:flex-end}
.inv-foot{border:1.5px solid #1a1d21;padding:10px;text-align:center;font-size:11px;display:flex;flex-direction:column;gap:2px;align-items:center}
.inv-foot img{max-height:34px;max-width:160px;object-fit:contain}
.inv-foot .inv-fshop{font-weight:700;color:var(--ac);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.inv-ids{font-size:10px;color:#555d65}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-wrap:anywhere;color:var(--led);background:#0b0f12;padding:8px;border-radius:4px;margin-top:4px}
.cam{position:relative;background:#000;border-radius:8px;overflow:hidden}
.cam video{width:100%;max-height:58vh;display:block;object-fit:cover}
.cam-box{position:absolute;inset:14% 14%;border:2px solid var(--led);border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
/* the printed catalogue */
.cat{background:#fff;color:#14171a;padding:16px;border-radius:2px;display:flex;flex-direction:column;gap:12px}
.cat-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid #14171a;padding-bottom:8px;font-size:13px}
.cat-head b{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.cat-logo{max-height:40px;max-width:120px;object-fit:contain}
.cat-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-i{border:1px solid #c9ced4;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:4px;font-size:11px}
.cat-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cat-img{width:84px;height:84px;object-fit:cover;border-radius:3px;background:#eef1f3;flex:none}
.cat-qr{width:72px;flex:none}
.cat-n{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.15}
.cat-r{color:#687078;font-size:10.5px}
.cat-s{display:flex;flex-direction:column;gap:1px;color:#2b3137}
.cat-b{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid #e2e6ea;padding-top:5px;margin-top:2px}
.cat-p{font-family:var(--display);font-weight:600;font-size:15px}
.cat-q{font-size:10.5px;color:#687078}
@media (max-width:420px){.cat-g{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1 id="brand"></h1><p class="sub" id="today"></p></div>
    <span class="chip" id="demo">Données d'exemple</span>
  </header>
  <main id="view" class="list"></main>
</div>
<nav><div id="nav"></div></nav>
<div class="sheet" id="sheet" hidden><form id="form"></form></div>
<input id="cam" type="file" accept="image/*" capture="environment" aria-label="Photo du QR code" tabindex="-1">
<input id="fiche-cam" type="file" accept="image/*" capture="environment" aria-label="Photo de la fiche technique" tabindex="-1">
<input id="fiche-img" type="file" accept="image/*" aria-label="Image de la fiche technique" tabindex="-1">
<input id="bon-cam" type="file" accept="image/*" capture="environment" aria-label="Photo du bon d'achat" tabindex="-1">
<input id="bon-img" type="file" accept="image/*" aria-label="Image du bon d'achat" tabindex="-1">
<input id="logo" type="file" accept="image/*" aria-label="Image du logo" tabindex="-1">
<input id="pick" type="file" accept="image/*" aria-label="Choisir une image de QR" tabindex="-1">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* ---------- logic (no DOM) ---------- */
const KEY='daftar-v3', DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const plus=n=>iso(new Date(today().getTime()+n*DAY));
const days=s=>Math.round((new Date(s+'T00:00:00')-today())/DAY);
const addMonths=(s,m)=>{const d=new Date(s+'T00:00:00');d.setMonth(d.getMonth()+m);return iso(d)};
const dh=n=>Math.round(n).toLocaleString('fr-FR').replace(/ | /g,' ')+' DH';
const fdate=s=>new Date(s+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}).replace(/\.$/,'');
const uid=()=>Math.random().toString(36).slice(2,9);
const waNum=p=>{let n=String(p).replace(/\D/g,'');if(n.startsWith('0'))n='212'+n.slice(1);return n};
const wa=(p,t)=>'https://wa.me/'+waNum(p)+'?text='+encodeURIComponent(t);
const PAY={comptant:'Comptant',credit:'Crédit',livraison:'À la livraison'};
/* every limit the application enforces, in one place */
const R={maxQty:50,maxPrice:500000,maxTxt:60};
const APP=(typeof location!=='undefined'&&!/claude\.ai$/.test(location.hostname))?location.origin+location.pathname.replace(/[^/]*$/,''):'https://claude.ai/artifact/PiRDQUXcQGrH12ND2seBJX';
const RULES={disc:10,retDays:7};
const okPhone=v=>{const d=String(v).replace(/[^\d+]/g,'').replace(/^\+/,'');return !d||/^(0[5-7]\d{8}|212[5-7]\d{8})$/.test(d)};
const serialTaken=(s,x)=>!!x&&s.units.some(u=>u.serial.toLowerCase()===x.toLowerCase());
const floorPrice=(s,r)=>Math.round(r.price*(1-(s.rules||RULES).disc/100));
const tooOld=(s,t)=>-days(t.date)>(s.rules||RULES).retDays;
/* every movement of money is written once in the journal: amt > 0 comes in, amt < 0 goes out */
/* every day closes on its own at midnight: nothing new is written into a day before today */
const isClosedDay=d=>!!d&&d<plus(0);
const op=(s,type,label,amt,d,ticket)=>{if(amt)s.ops.push({id:uid(),d:d||plus(0),type,label,amt,ticket:ticket||null})};

/* what a shop sells: four kinds of vehicles, each tracked unit by unit with its serial number,
   and parts or accessories, counted. Anything that is not 'p' is a vehicle. */
const KINDS={t:'Trottinette',v:'Vélo électrique',s:'Scooter électrique',m:'Moto électrique',p:'Pièce ou accessoire'};
const isVeh=r=>!!r&&r.kind!=='p';
/* stock: one record per vehicle (unit), one counter per part reference */
const refOf=(s,id)=>s.stock.find(r=>r.id===id);
const unitsOf=(s,ref,st='stock')=>s.units.filter(u=>u.ref===ref&&u.status===st);
const qtyOf=(s,r)=>r.kind!=='p'?unitsOf(s,r.id).length:r.qty;
const stockState=(s,r)=>{const q=qtyOf(s,r);return q<=0?{k:'bad',t:'Rupture',o:0}:q<=r.min?{k:'warn',t:'Stock bas',o:1}:{k:'ok',t:'En stock',o:2}};
const stockLow=s=>s.stock.filter(r=>qtyOf(s,r)<=r.min);
const stockValue=s=>s.stock.reduce((a,r)=>a+(r.kind!=='p'?unitsOf(s,r.id).reduce((b,u)=>b+(u.cost||r.cost||r.price),0):r.qty*(r.cost||r.price)),0);
const autoSerial=(s,r)=>r.name.replace(/[^A-Za-z0-9]/g,'').slice(0,4).toUpperCase()+'-'+String(++s.sn).padStart(5,'0');

const full=r=>((r.brand?r.brand+' ':'')+r.name).trim();
const supOf=(s,id)=>s.sups.find(x=>x.id===id);
const supName=(s,id)=>{const x=supOf(s,id);return x?x.name:''};
const buyRest=b=>b.amount-b.paid;
const supStats=(s,id)=>{const l=s.buys.filter(b=>b.sup===id);
  return{n:l.length,total:l.reduce((a,b)=>a+b.amount,0),due:l.reduce((a,b)=>a+buyRest(b),0),last:l.reduce((a,b)=>a>b.d?a:b.d,'')}};
const supDue=s=>s.buys.reduce((a,b)=>a+buyRest(b),0);
/* a purchase on credit leaves no money today: the journal records it when the supplier is paid */
function payBuy(s,id,a){const b=s.buys.find(x=>x.id===id),max=buyRest(b);
  if(!(a>0))return{err:'Saisissez un montant supérieur à 0.'};
  if(a>max)return{err:'Maximum '+dh(max)+" : c'est tout ce qui reste à payer sur cet achat."};
  b.paid+=a;s.pays.push({id:uid(),sup:b.sup,d:plus(0),amount:a,buy:b.id});
  op(s,'achat','Paiement fournisseur'+(b.sup?' · '+supName(s,b.sup):'')+' · '+b.label,-a);return{ok:true}}
function statement(s,sup){const l=s.buys.filter(b=>b.sup===sup).map(b=>({d:b.d,label:b.label,debit:b.amount,credit:0}))
  .concat(s.pays.filter(x=>x.sup===sup).map(x=>({d:x.d,label:'Paiement',debit:0,credit:x.amount})))
  .sort((a,b)=>a.d.localeCompare(b.d)||b.debit-a.debit);
  let bal=0;return l.map(x=>{bal+=x.debit-x.credit;return{...x,bal}}).reverse()}
/* nothing enters the stock without knowing where it comes from: a supplier, or 'initial' for what
   was already in the shop before Daftar (allowed until the article's first supplier delivery) */
const INITIAL='initial';
function supErr(s,refId,sup){
  if(!sup)return 'Choisissez le fournisseur : rien n’entre en stock sans savoir d’où ça vient.';
  if(sup===INITIAL&&s.buys.some(b=>b.ref===refId&&b.sup))return 'Le stock de départ ne sert qu’avant la première réception chez un fournisseur. Choisissez le fournisseur.';
  if(sup!==INITIAL&&!s.sups.some(f=>f.id===sup))return 'Fournisseur inconnu.';
  return ''}
/* date: the supplier's document; bookDate: the day the money is written in the journal (an earlier,
   closed day cannot receive new entries, so the screen passes today) */
function receive(s,refId,n,cost,serials,date,sup,unpaid,bookDate){const r=refOf(s,refId),out=[];
  if(cost)r.cost=cost;
  const amt=(cost||r.cost||0)*n,d=date||plus(0),bd=bookDate||d,lab=n+' × '+((r.brand?r.brand+' ':'')+r.name);
  const bid=uid(),initial=sup===INITIAL;if(initial){sup='';unpaid=false}
  /* opening stock was paid before Daftar: no payment and nothing in this month's journal */
  s.buys.push({id:bid,sup:sup||'',d,ref:refId,label:lab,qty:n,amount:amt,paid:unpaid?0:amt,...(initial?{initial:true}:{})});
  if(!unpaid&&!initial){s.pays.push({id:uid(),sup:sup||'',d:bd,amount:amt,buy:bid});
   op(s,'achat','Achat stock : '+lab+(sup?' · '+supName(s,sup):'')+(bd!==d?' (document du '+d.split('-').reverse().join('/')+')':''),-amt,bd)}
  if(r.kind==='p'){r.qty+=n;return out}
  for(let i=0;i<n;i++){const u={id:uid(),ref:refId,serial:(serials&&serials[i])||autoSerial(s,r),cost:cost||r.cost||0,inDate:d,status:'stock',sup:sup||''};s.units.push(u);out.push(u)}
  return out}
/* Until 16 Nov 2026 the reception forms called receive() without the date: the supplier id landed
   in the date, the supplier stayed empty, "à payer plus tard" was ignored. This puts the supplier
   back where it belongs. The real date is lost: today's date is used and marked uncertain. */
/* Until 16 Nov 2026 the sample shop renamed its scooters without updating the ticket lines: a
   return then left the scooter "sold". Lines are relinked to their scooter by serial number. */
function relinkUnits(s){let n=0;
  s.tickets.forEach(t=>(t.lines||[]).forEach(l=>{if(!l.unit||s.units.some(u=>u.id===l.unit))return;
    const u=s.units.find(x=>x.serial===l.serial&&x.ref===l.ref);if(u){l.unit=u.id;n++}}));
  return n}
const isDay=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'');
function repairReceptions(s){let n=0;const today=plus(0);
  s.buys.forEach(b=>{if(isDay(b.d))return;
    if(typeof b.sup!=='string'||!b.sup)b.sup=s.sups.some(f=>f.id===b.d)?b.d:'';
    b.d=today;b.dateIncertaine=true;n++});
  s.pays.forEach(p=>{if(isDay(p.d))return;const b=s.buys.find(x=>x.id===p.buy);
    if(typeof p.sup!=='string'||!p.sup)p.sup=b?b.sup:'';p.d=b?b.d:today;n++});
  s.units.forEach(u=>{if(typeof u.sup!=='string')u.sup='';if(!isDay(u.inDate)){u.inDate=today;n++}});
  s.ops.forEach(o=>{if(!isDay(o.d)){o.d=today;n++}});
  [s.buys,s.pays].forEach(l=>l.forEach(x=>{if(typeof x.sup!=='string'){x.sup='';n++}}));
  return n}

function sell(s,o){const d=o.date||plus(0),lines=[];
  for(const L of (o.lines||[])){let u=null,r;
    if(L.unit){u=s.units.find(x=>x.id===L.unit);if(!u||u.status!=='stock')return null;r=refOf(s,u.ref)}
    else{r=refOf(s,L.ref)}
    if(!r)return null;
    const qty=u?1:Math.max(1,L.qty||1);
    if(!u&&r.qty<qty)return null;
    const price=L.price??r.price;
    lines.push({ref:r.id,unit:u?u.id:null,model:full(r),serial:u?u.serial:'',qty,price,total:price*qty,
      cost:(u?(u.cost||r.cost||0):(r.cost||0))*qty,war:r.war??0,kind:r.kind})}
  if(!lines.length)return null;
  const total=lines.reduce((a,l)=>a+l.total,0),cost=lines.reduce((a,l)=>a+l.cost,0);
  const t={id:uid(),no:'T-'+String(++s.seq).padStart(4,'0'),date:d,name:o.name||'Client comptoir',phone:o.phone||'',
    lines,total,cost,pay:o.pay||'comptant',status:'ok',linked:o.linked||null};
  lines.forEach(l=>{if(l.unit){const u=s.units.find(x=>x.id===l.unit);u.status='vendu';u.soldDate=d;u.ticket=t.no}
    else{const r=refOf(s,l.ref);r.qty-=l.qty}});
  s.tickets.push(t);
  lines.filter(l=>l.unit).forEach(l=>s.sales.push({id:uid(),name:t.name,phone:t.phone,model:l.model,serial:l.serial,
    date:d,months:o.months??l.war??0,repairs:[],ticket:t.no}));
  if(t.pay==='credit'){const c=o.credit||{};s.credits.push({id:uid(),name:t.name,phone:t.phone,model:tLabel(t),total,
    paid:Math.min(total,c.paid||0),inst:c.inst||Math.ceil(total/4),due:c.due||addMonths(d,1),ticket:t.no})}
  if(t.pay==='livraison'){const l=o.del||{};s.dels.push({id:uid(),name:t.name,phone:t.phone,city:l.city||'',model:tLabel(t),
    amount:total,carrier:l.carrier||'',status:l.status||'expedie',sent:d,ticket:t.no})}
  const lab=t.no+' · '+tLabel(t)+' · '+t.name;
  if(t.pay==='comptant')op(s,'vente','Vente '+lab,total,d,t.no);
  if(t.pay==='credit')op(s,'encaissement','Avance crédit '+lab,Math.min(total,(o.credit||{}).paid||0),d,t.no);
  if(t.pay==='livraison'&&(o.del||{}).status==='encaisse')op(s,'livraison','Livraison encaissée '+lab,total,d,t.no);
  return t}
const tLabel=t=>{const l=t.lines[0];return l.model+(l.qty>1?' × '+l.qty:'')+(t.lines.length>1?' et '+(t.lines.length-1)+' autre'+(t.lines.length>2?'s':''):'')};
const tQty=t=>t.lines.reduce((a,l)=>a+l.qty,0);

function refund(s,no,o){const t=s.tickets.find(x=>x.no===no);if(!t||t.status!=='ok')return null;
  const c=s.credits.find(x=>x.ticket===no),l=s.dels.find(x=>x.ticket===no);
  const back=t.pay==='credit'?(c?c.paid:t.total):t.pay==='livraison'?(l&&l.status==='encaisse'?t.total:0):t.total;
  t.status=o.exchange?'echange':'retourne';t.ret={d:o.date||plus(0),reason:o.reason,cond:o.cond,refund:back};
  t.lines.forEach(ln=>{if(ln.unit){const u=s.units.find(x=>x.id===ln.unit);if(u){u.status=o.cond;delete u.soldDate;delete u.ticket}}
    else if(o.cond==='stock'){const r=refOf(s,ln.ref);if(r)r.qty+=ln.qty}});
  s.sales=s.sales.filter(v=>v.ticket!==no);s.credits=s.credits.filter(x=>x.ticket!==no);
  if(l)l.status='retour';
  op(s,'remboursement','Remboursement '+no+' · '+tLabel(t)+' · '+t.name,-back,t.ret.d,no);
  if(t.facture){const a={...s.invoices.find(f=>f.no===t.facture),id:uid(),no:'A-'+t.ret.d.slice(0,4)+'-'+String(++s.aseq).padStart(4,'0'),type:'avoir',date:t.ret.d,of:t.facture,reason:o.reason};s.invoices.push(a);t.avoir=a.no}
  return t}

/* a payment can never exceed what is still owed */
function payCredit(s,id,a,due){const c=s.credits.find(x=>x.id===id),max=rest(c);
  if(!(a>0))return{err:'Saisissez un montant supérieur à 0.'};
  if(a>max)return{err:'Maximum '+dh(max)+" : c'est tout ce qui reste à payer sur cette vente.",max};
  c.paid+=a;if(due&&rest(c)>0)c.due=due;
  op(s,'encaissement','Tranche '+(c.ticket||'ancien crédit')+' · '+c.model+' · '+c.name,a,null,c.ticket);return{ok:true,rest:rest(c)}}

/* invoices are numbered in one unbroken series and never deleted: a return produces a credit note (avoir) */
function invoice(s,no,c,date){const t=s.tickets.find(x=>x.no===no);if(!t)return null;
  if(t.facture)return s.invoices.find(f=>f.no===t.facture);if(t.status!=='ok')return null;
  const d=date||plus(0),f={id:uid(),no:'F-'+d.slice(0,4)+'-'+String(++s.fseq).padStart(4,'0'),type:'facture',date:d,ticket:no,
    kind:(c&&c.kind)==='b2b'?'b2b':'b2c',name:(c&&c.name)||t.name,addr:(c&&c.addr)||'',ice:(c&&c.kind)==='b2b'?(c.ice||''):'',
    lines:t.lines.map(l=>({model:l.model,serial:l.serial,qty:l.qty,price:l.price,total:l.total,war:l.war??0})),
    total:t.total,tva:s.info.tva||0,pay:t.pay};
  s.invoices.push(f);t.facture=f.no;return f}
/* Moroccan invoices carry the amount in words */
const U9=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize'];
function words(n){n=Math.round(n);if(n===0)return 'zéro';if(n<0)return 'moins '+words(-n);
  if(n<17)return U9.at(n);
  if(n<20)return 'dix-'+U9.at(n-10);
  if(n<100){const T=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
    const d=Math.floor(n/10),u=n%10,base=T.at(d),off=(d===7||d===9)?10+u:u;
    if(off===0)return base+(d===8?'s':'');
    return base+(off===1&&d!==8?' et un':'-'+words(off))}
  if(n<1000){const ce=Math.floor(n/100),r=n%100;
    const head=ce===1?'cent':words(ce)+' cent'+(r===0?'s':'');
    return r===0?head:head+' '+words(r)}
  if(n<1e6){const m=Math.floor(n/1000),r=n%1000;
    const head=m===1?'mille':words(m)+' mille';
    return r===0?head:head+' '+words(r)}
  const m=Math.floor(n/1e6),r=n%1e6;
  const head=words(m)+' million'+(m>1?'s':'');
  return r===0?head:head+' '+words(r)}
function amountWords(v){const e=Math.floor(Math.round(v*100)/100),c=Math.round((v-e)*100);
  return (words(e)+' dirham'+(e>1?'s':'')+(c?' et '+words(c)+' centime'+(c>1?'s':''):'')).replace(/^./,x=>x.toUpperCase())}

function setDel(s,id,st){const d=s.dels.find(x=>x.id===id),was=d.status;if(was===st)return;d.status=st;
  const lab=(d.ticket?d.ticket+' · ':'')+d.model+' · '+d.name;
  if(st==='encaisse')op(s,'livraison','Livraison encaissée '+lab,d.amount,null,d.ticket);
  else if(was==='encaisse')op(s,'livraison','Annulation encaissement '+lab,-d.amount,null,d.ticket)}

function journal(s,month){const l=s.ops.map((o,i)=>({...o,_i:i})).filter(o=>!month||o.d.startsWith(month)).sort((a,b)=>b.d.localeCompare(a.d)||b._i-a._i);
  const inn=l.reduce((a,o)=>a+(o.amt>0?o.amt:0),0),out=l.reduce((a,o)=>a+(o.amt<0?-o.amt:0),0);return{l,inn,out,net:inn-out}}

function exchange(s,no,o,pick){const old=refund(s,no,{...o,exchange:true});if(!old)return null;
  const nt=sell(s,{...pick,name:old.name,phone:old.phone,pay:'comptant',linked:no});
  if(nt)nt.diff=nt.total-old.ret.refund;return nt}

const soldIn=(s,n)=>s.tickets.filter(t=>t.status==='ok'&&days(t.date)>-n);

/* ---------- clôtures et tableau de bord (pure) ----------
   A report covers any period [from, to], dates included: sales, returns, payment modes, margin, money in
   and out, best sellers, sales per day. */
const addDays=(d,n)=>iso(new Date(new Date(d+'T00:00:00').getTime()+n*DAY));
const weekStart=d=>addDays(d,-((new Date(d+'T00:00:00').getDay()+6)%7));
const monthEnd=m=>addDays(m+'-01',new Date(+m.slice(0,4),+m.slice(5,7),0).getDate()-1);
function periodReport(s,from,to){const inP=d=>!!d&&d>=from&&d<=to;
  const sold=s.tickets.filter(t=>inP(t.date)),ok=sold.filter(t=>t.status==='ok');
  const back=s.tickets.filter(t=>t.ret&&inP(t.ret.d));
  const ops=s.ops.filter(o=>inP(o.d)),sum=l=>l.reduce((a,x)=>a+x,0);
  const pay={comptant:0,credit:0,livraison:0};sold.forEach(t=>{pay[t.pay]=(pay[t.pay]||0)+t.total});
  const inBy={},outBy={};ops.forEach(o=>{const m=o.amt>0?inBy:outBy;m[o.type]=(m[o.type]||0)+Math.abs(o.amt)});
  const top={};ok.forEach(t=>t.lines.forEach(l=>{const k=l.ref;top[k]=top[k]||{ref:k,model:l.model,qty:0,total:0};top[k].qty+=l.qty;top[k].total+=l.total}));
  const perDay={};for(let d=from;d<=to;d=addDays(d,1))perDay[d]=0;sold.forEach(t=>perDay[t.date]=(perDay[t.date]||0)+t.total);
  const withCost=ok.filter(t=>typeof t.cost==='number');
  const brut=sum(sold.map(t=>t.total)),retours=sum(back.map(t=>t.total));
  return {from,to,n:sold.length,brut,retours,nRetours:back.length,ca:brut-retours,panier:sold.length?Math.round(brut/sold.length):0,
    marge:sum(withCost.map(t=>t.total-t.cost)),margeSur:sum(withCost.map(t=>t.total)),pay,
    entrees:sum(ops.filter(o=>o.amt>0).map(o=>o.amt)),sorties:-sum(ops.filter(o=>o.amt<0).map(o=>o.amt)),net:sum(ops.map(o=>o.amt)),
    inBy,outBy,top:Object.values(top).sort((a,b)=>b.total-a.total).slice(0,5),perDay}}
/* the drawer: it starts from the last count (what was left in it), plus every movement since. Before the
   very first count nothing is known about it: only the day's own movements are expected. */
const closeOf=(s,d)=>(s.closes||[]).find(c=>c.d===d);
function cashDay(s,d){const last=(s.closes||[]).filter(c=>c.d<d&&c.counted!=null).sort((a,b)=>b.d.localeCompare(a.d))[0];
  const fond0=last?last.left+s.ops.filter(o=>o.d>last.d&&o.d<d).reduce((a,o)=>a+o.amt,0):0;
  const net=s.ops.filter(o=>o.d===d).reduce((a,o)=>a+o.amt,0);
  return {d,fond0,net,expected:fond0+net,known:!!last}}
/* counting can be done several times a day; the last count is the one kept at midnight */
function countCash(s,d,counted,left,by){if(!(counted>=0)||!(left>=0)||left>counted)return null;
  if(!s.closes)s.closes=[];const c0=cashDay(s,d);let c=closeOf(s,d);
  if(!c){c={id:'c-'+d,d,closed:false};s.closes.push(c)}
  Object.assign(c,{fond0:c0.fond0,net:c0.net,expectedAtCount:c0.expected,counted,left,ecart:counted-c0.expected,by:by||'',at:new Date().toISOString()});
  return c}
/* every day before today closes on its own: those with activity get their record, counted or not */
function autoClose(s,today){today=today||plus(0);if(!s.closes)s.closes=[];let n=0;
  const active=new Set(s.ops.map(o=>o.d).concat(s.tickets.map(t=>t.date)).filter(d=>d&&d<today));
  (s.closes||[]).forEach(c=>{if(c.d<today)active.add(c.d)});
  [...active].sort().forEach(d=>{let c=closeOf(s,d);if(c&&c.closed)return;
    const k=cashDay(s,d),r=periodReport(s,d,d);
    if(!c){c={id:'c-'+d,d,counted:null,left:null};s.closes.push(c)}
    Object.assign(c,{fond0:k.fond0,net:k.net,closed:true,closedAt:new Date().toISOString(),ca:r.ca,n:r.n});n++});
  return n}
function analyse(s){const t30=soldIn(s,30);
  const rows=s.stock.map(r=>{const q=qtyOf(s,r),s30=t30.reduce((a,t)=>a+t.lines.filter(l=>l.ref===r.id).reduce((b,l)=>b+l.qty,0),0);
    const oldest=(r.kind!=='p'?unitsOf(s,r.id):[]).reduce((a,u)=>Math.max(a,-days(u.inDate)),0);
    const done=s.units.filter(u=>u.ref===r.id&&u.status==='vendu');
    const avg=done.length?Math.round(done.reduce((a,u)=>a+days(u.soldDate)-days(u.inDate),0)/done.length):null;
    const cover=s30?Math.round(q/(s30/30)):null,margin=r.cost?r.price-r.cost:null;
    const tag=q<=0?{k:'bad',t:s30?'Rupture, à commander':'Rupture'}:cover!==null&&cover<15?{k:'warn',t:'Part vite, à recommander'}:!s30&&oldest>=60?{k:'warn',t:'Dort depuis '+oldest+' j'}:{k:'ok',t:'Rythme normal'};
    return{r,q,s30,oldest,avg,cover,margin,tag}}).sort((a,b)=>b.s30-a.s30);
  const reasons={};s.tickets.forEach(t=>{if(t.ret)reasons[t.ret.reason]=(reasons[t.ret.reason]||0)+1});
  const ret=s.tickets.filter(t=>t.status!=='ok').length;
  return{rows,reasons,ca:t30.reduce((a,t)=>a+t.total,0),margin:t30.reduce((a,t)=>a+(t.cost?t.total-t.cost:0),0),n:t30.length,
    retRate:s.tickets.length?Math.round(ret/s.tickets.length*100):0,value:stockValue(s)}}

/* ---------- synchronisation: S <-> éléments en ligne (pure, no network) ----------
   Each item of S becomes one row {c: collection, k: key, d: data}. Costs travel apart
   (stock$, units$, tickets$) and buys, pays, ops are private: the server never sends them

  for(const c of SYNC_COLS)for(const x of (s[c]||[])){if(!x.id)x.id=uid();
    if(c==='stock'||c==='units'){const {cost,...p}=x;put(c,x.id,p);if(cost!==undefined)put(c+'$',x.id,{cost})}
    else if(c==='tickets'){const {cost,lines,...p}=x;put(c,x.id,{...p,lines:(lines||[]).map(({cost,...l})=>l)});

function applyRow(s,r){

  const base=r.c.replace('$',''),list=s[base];if(!list)return;
  const i=list.findIndex(x=>x.id===r.k),old=i<0?null:list[i];
  if(r.c.endsWith('$')){if(!old||r.del)return;

  if(r.del){if(i>=0)list.splice(i,1);return}
  const n={...r.d,id:r.k};
  if(old&&old.cost!==undefined&&n.cost===undefined)n.cost=old.cost;
  /* a cash count is never erased by an automatic closing made on a phone that had not seen it */
  if(base==='closes'&&old&&old.counted!=null&&n.counted==null)['counted','left','ecart','expectedAtCount','by','at'].forEach(k=>{n[k]=old[k]});

function fixCounters(s){

  s.fseq=Math.max(s.fseq||0,lastNum(s.invoices.filter(f=>f.type!=='avoir').map(f=>f.no),/^F-\d{4}-(\d+)$/));
  s.aseq=Math.max(s.aseq||0,lastNum(s.invoices.filter(f=>f.type==='avoir').map(f=>f.no),/^A-\d{4}-(\d+)$/));
  s.sn=Math.max(s.sn||0,lastNum(s.units.map(u=>u.serial),/^[A-Z0-9]{0,4}-(\d{5})$/))}
/* a seller's ticket arrives without its cost: the boss's phone computes it from what it knows */
function fillCosts(s){let n=0;
  s.tickets.forEach(t=>{if(t.cost!==undefined)return;

function renameTicket(s,id,nw,mine=()=>true){const t=s.tickets.find(x=>x.id===id);if(!t)return;const old=t.no;t.no=nw;
  const units=new Set((t.lines||[]).map(l=>l.unit).filter(Boolean));
  s.units.forEach(u=>{if(units.has(u.id)&&u.ticket===old)u.ticket=nw});
  s.tickets.forEach(x=>{if(x.linked===old&&mine('tickets',x))x.linked=nw});
  ['sales','credits','dels','invoices'].forEach(c=>s[c].forEach(x=>{if(x.ticket===old&&mine(c,x))x.ticket=nw}));
  s.ops.forEach(o=>{if(o.ticket===old&&mine('ops',o)){o.ticket=nw;o.label=o.label.split(old).join(nw)}})}
function renameInvoice(s,id,nw,mine=()=>true){const f=s.invoices.find(x=>x.id===id);if(!f)return;const old=f.no;f.no=nw;
  s.invoices.forEach(x=>{if(x.of===old&&mine('invoices',x))x.of=nw});
  s.tickets.forEach(t=>{if(mine('tickets',t)){if(t.facture===old)t.facture=nw;if(t.avoir===old)t.avoir=nw}})}

  if(col==='tickets')return 'T-'+String(++s.seq).padStart(4,'0');
  const y=(item.date||plus(0)).slice(0,4);

function hashOf(v){const t=JSON.stringify(v);let h1=0xdeadbeef,h2=0x41c6ce57;

  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(36)+(h1>>>0).toString(36)}

function qr(text){if(!window.qrcode)return `<div class="t-c">${esc(text)}</div>`;
  try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let p='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+2} ${r+2}h1v1h-1z`;
    return `<svg class="qr" viewBox="0 0 ${n+4} ${n+4}" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`}catch(e){return ''}}

 credit:[['Urgence',null,(a,b)=>creditState(a).o-creditState(b).o||days(a.due)-days(b.due)],['En retard',c=>rest(c)>0&&days(c.due)<0,(a,b)=>days(a.due)-days(b.due)],

   ['Réparées',v=>v.repairs.length>0,(a,b)=>b.repairs.length-a.repairs.length],['Nom',null,byName]],

const LO={nouveau:0,discussion:1,reserve:2,vendu:3,perdu:4},DO={livre:0,expedie:1,retour:2,encaisse:3};
function bar(k){const m=MODES[k];if(!m)return '';const i=view[k]||0;
  return `<div class="subnav sorts">${m.map((x,j)=>`<button type="button" data-view="${k}" data-i="${j}"${j===i?' aria-current="page"':''}>${x[0]}</button>`).join('')}</div>`}
function pick(k,arr){const m=MODES[k];if(!m)return arr;const [,f,s]=m[view[k]||0];
  let l=f?arr.filter(f):[...arr];if(s)l=l.sort(s);return l}
const fname=ext=>(S.shop||'magasin').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30)+'-compta-'+(jm||'tout')+'.'+ext;
async function saveFile(filename,data,done){
  if(!DL){try{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);
    const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);if(done)say(done)}catch(e){say("Le fichier n'a pas pu \u00eatre enregistr\u00e9.")}return}
  try{const r=await DL.save({filename,data});if(done&&r&&r.status==='saved')say(done)}catch(e){const c=e&&e.code;if(c==='declined')return;
  say(c==='rate_limited'?"Une demande d'enregistrement est déjà ouverte. Répondez-y, puis réessayez.":c==='extension_not_enabled'||c==='rejected_extension'?"Ce format de fichier n'est pas autorisé ici. Essayez l'autre format.":"Le fichier n'a pas pu être enregistré depuis cette vue. Utilisez « Copier le journal ».")}}

/* An A4 page is drawn off screen at the width of a real page (794 px = 210 mm at 96 dpi), whatever
   the phone's width: otherwise the PDF of a phone screen is a narrow strip in the middle of the page. */
const A4PX=794;
async function shoot(){const node=$('#paper');
  if(!node)return null;
  if(!window.html2canvas){say("L'outil d'impression n'a pas pu se charger. Vérifiez la connexion et rechargez la page.");return null}
  const a4=paper&&paper.fmt==='a4';let box=null,target=node;
  if(a4){box=document.createElement('div');box.style.cssText='position:fixed;left:-20000px;top:0;width:'+A4PX+'px;background:#fff';
    target=node.cloneNode(true);box.appendChild(target);document.body.appendChild(box)}
  try{return await html2canvas(target,{scale:a4?2:3,backgroundColor:'#ffffff',logging:false,...(a4?{windowWidth:A4PX}:{})})}
  catch(e){say("La page n'a pas pu être transformée en image.");return null}
  finally{if(box)box.remove()}}
async function savePng(){const c=await shoot();if(!c)return;
  c.toBlob(b=>{if(b)saveFile((paper&&paper.name||'document')+'.png',b,"Image enregistrée. Joignez-la dans WhatsApp depuis la galerie.");else say("L'image n'a pas pu être créée.")},'image/png')}
/* A4 : 10 mm margins, 190 mm wide; a longer document continues on the next page instead of shrinking */
async function makePdf(){if(!window.jspdf){say("L'outil PDF n'a pas pu se charger. Vérifiez la connexion et rechargez la page.");return null}
  const c=await shoot();if(!c)return null;const r=c.height/c.width;let doc;
  if(paper&&paper.fmt==='receipt'){const w=80,hh=Math.max(40,Math.round(w*r));doc=new jspdf.jsPDF({unit:'mm',format:[w,hh]});doc.addImage(c.toDataURL('image/png'),'PNG',0,0,w,hh)}
  else{doc=new jspdf.jsPDF({unit:'mm',format:'a4'});const W=190,H=277,pxmm=c.width/W,step=Math.floor(H*pxmm);
    for(let y=0,pg=0;y<c.height;y+=step,pg++){const h=Math.min(step,c.height-y),part=document.createElement('canvas');part.width=c.width;part.height=h;
      part.getContext('2d').drawImage(c,0,y,c.width,h,0,0,c.width,h);if(pg)doc.addPage();
      doc.addImage(part.toDataURL('image/jpeg',.92),'JPEG',10,10,W,h/pxmm)}}
  return {blob:doc.output('blob'),name:(paper&&paper.name||'document')+'.pdf'}}
async function savePdf(){const p=await makePdf();if(!p)return;
  saveFile(p.name,p.blob,"Document prêt. Ouvrez-le depuis le téléphone, puis choisissez Imprimer ou Partager.")}
/* the phone's own share menu: WhatsApp receives the PDF as a document, nothing to look for in the files */
async function sharePdf(){const p=await makePdf();if(!p)return;

function recvCheck(d,r){const q=n(d.qty);
  if(d.d&&(!isDay(d.d)||days(d.d)>0))return 'La date de réception ne peut pas être dans le futur.';
  if(d.sup!==undefined){const e=supErr(S,r&&r.id,d.sup);if(e)return e}
  if(q<1)return 'La quantité doit être au moins 1.';
  if(q>R.maxQty)return 'Maximum '+R.maxQty+' unités par réception. Faites-en plusieurs.';
  if(n(d.cost)>R.maxPrice)return "Prix d'achat trop élevé.";
  if(d.price!==undefined&&n(d.price)<=0)return 'Le prix de vente doit être supérieur à 0.';
  const l=sers(d.ser);
  if(l.length>q)return 'Vous avez saisi '+l.length+' numéros de série pour '+q+' unité'+(q>1?'s':'')+'.';
  const dup=l.find(x=>serialTaken(S,x));
  if(dup)return 'Le numéro de série '+dup+' existe déjà dans ce magasin.';
  if(new Set(l.map(x=>x.toLowerCase())).size!==l.length)return 'Deux numéros de série identiques dans la même réception.';

function addCart(refId,unitId){const r=refOf(S,refId);if(!r)return say('Article inconnu.');
  if(r.kind!=='p'){const taken=cart.filter(c=>c.unit).map(c=>c.unit);
    let u=unitId?S.units.find(x=>x.id===unitId):null;
    if(u&&(u.status!=='stock'||taken.includes(u.id)))return say(esc(full(r))+' · '+esc(u.serial)+' n’est pas disponible.');
    if(!u)u=unitsOf(S,refId).find(x=>!taken.includes(x.id));
    if(!u)return say('Plus de '+esc(full(r))+' en stock.');
    cart.push({ref:refId,unit:u.id,serial:u.serial,qty:1,price:r.price})}
  else{const c=cart.find(x=>x.ref===refId&&!x.unit);
    if(c){if(c.qty>=r.qty)return say('Seulement '+r.qty+' en stock.');c.qty++}
    else{if(r.qty<1)return say('Plus de '+esc(full(r))+' en stock.');cart.push({ref:refId,unit:null,serial:'',qty:1,price:r.price})}}
  if(tab()!=='vente')location.hash='#vente';else render();

  sheet('Encaisser '+dh(total),f,d=>{
    const base={lines:cart.map(c=>({ref:c.ref,unit:c.unit,qty:c.qty,price:c.price})),name:d.name.trim(),phone:d.phone.trim(),pay:d.pay,months:Number(d.months||0)};
    const done=x=>{const t=sell(S,{...base,...x});if(t){cart=[];S.demo=false;showTicket(t.no)}else say('Un article du panier n’est plus en stock.')};
    if(d.pay==='credit')sheet('Crédit : '+dh(total),[{k:'paid',l:'Avance payée (DH)',t:'number',v:0},{k:'inst',l:'Montant de chaque tranche (DH)',t:'number',v:Math.ceil(total/4)},{k:'due',l:'Prochaine échéance',t:'date',v:plus(30)}],
      c=>done({credit:{paid:n(c.paid),inst:n(c.inst),due:c.due}}),c=>{

        const r0=total-n(c.paid);

     const sw=Math.max(8,Math.round(img.width*fw)),sh=Math.max(8,Math.round(img.height*fh));
     const sx=Math.min(img.width-sw,Math.max(0,Math.round(img.width*fx))),sy=Math.min(img.height-sh,Math.max(0,Math.round(img.height*fy)));

async function refusedRow(r,e){
  if(e.code==='23505'&&(r.c==='tickets'||r.c==='invoices')){const it=S[r.c].find(x=>x.id===r.k);
    if(it){await pullAll();const old=it.no,nw=nextNumber(S,it,r.c),rows=toRows(S,canCost());
      const mine=(c,x)=>{const key=c+'|'+x.id,row=rows.get(key);return !(key in link.h)||!row||link.h[key]!==hashOf(row.d)};
      (r.c==='tickets'?renameTicket:renameInvoice)(S,r.k,nw,mine);
      syncInfo.refused.push(old+' existait déjà sur un autre téléphone : renuméroté '+nw+'.');return}}
  syncInfo.refused.push(e.message);
  const got=await api('elements?select=collection,cle,donnees,supprime,version&magasin_id=eq.'+link.m+'&collection=eq.'+encodeURIComponent(r.c)+'&cle=eq.'+encodeURIComponent(r.k)).catch(()=>[]);
  /* the server's version wins; a row it never had stays on this phone, never erased */
  if(got&&got[0]){applyRow(S,{c:r.c,k:r.k,d:got[0].donnees,del:got[0].supprime})}
  const now=toRows(S,canCost()).get(r.key);if(now)link.h[r.key]=hashOf(now.d);else delete link.h[r.key]}
async function pullAll(){let got=[],page;
  do{page=await api('elements?select=collection,cle,donnees,supprime,version&magasin_id=eq.'+link.m+'&version=gt.'+(link.v||0)+'&order=version.asc&limit=500');
    got=got.concat(page);if(page.length)link.v=page[page.length-1].version}while(page.length===500);
  if(!got.length)return 0;
  const before=toRows(S,canCost()),dirty=key=>{const r=before.get(key);return r&&key in link.h&&link.h[key]!==hashOf(r.d)};
  const rows=got.map(g=>({c:g.collection,k:g.cle,d:g.donnees,del:g.supprime,key:g.collection+'|'+g.cle}));
  /* public rows first, then the cost parts that complete them */
  rows.sort((a,b)=>a.c.endsWith('$')-b.c.endsWith('$'));
  for(const r of rows){if(dirty(r.key))continue;applyRow(S,r)}
  repairReceptions(S);relinkUnits(S);fixCounters(S);autoClose(S);if(canCost())fillCosts(S);
  const after=toRows(S,canCost());
  for(const r of rows){if(dirty(r.key))continue;const a=after.get(r.key);if(r.del||!a)delete link.h[r.key];else link.h[r.key]=hashOf(a.d)}
  return got.length}
/* a request made while an exchange runs is not lost: one more exchange follows */
function syncNow(){if(!online())return Promise.resolve();
  if(syncInfo.run){syncInfo.again=true;return syncInfo.run}
  syncInfo.run=(async()=>{do{syncInfo.again=false;await syncOnce()}while(syncInfo.again&&online())})().finally(()=>{syncInfo.run=null});
  return syncInfo.run}
async function syncOnce(){syncInfo.busy=true;let changed=0;const nRef=syncInfo.refused.length,wasErr=syncInfo.err;
  try{for(let round=0;round<3;round++){const sent=await pushAll(),got=await pullAll();changed+=got;if(!pending().length)break}
    if(autoClose(S))changed++;
    syncInfo.err='';syncInfo.at=Date.now()}
  catch(e){syncInfo.err=e.net?'Hors ligne : les modifications partiront au retour du réseau.':e.message}
  finally{syncInfo.busy=false;keepLink();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  if(changed||syncInfo.refused.length!==nRef||wasErr!==syncInfo.err)render();else{const el=$('#sync-st');if(el)el.textContent=syncText()}}
setInterval(()=>{if(online()&&document.visibilityState==='visible')syncNow().catch(()=>{})},20000);
addEventListener('online',()=>syncLater(200));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncLater(200)});

/* ---------- nouvel article par photo : l'IA lit la fiche, le commerçant vérifie ---------- */
const loadImg=file=>new Promise((ok,ko)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('Image illisible.'));i.src=u});
function jpeg(img,max,q,box){const sx=box?box.x:0,sy=box?box.y:0,sw=box?box.w:img.naturalWidth,sh=box?box.h:img.naturalHeight;
  const k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
/* the product's own picture, cut out of the sheet with a small margin */
function cutOut(img,p){if(!p||!p.presente||p.l<.05||p.h<.05)return '';const W=img.naturalWidth,H=img.naturalHeight,m=.03;
  const x=Math.max(0,(p.x-m)*W),y=Math.max(0,(p.y-m)*H),w=Math.min(W-x,(p.l+2*m)*W),h=Math.min(H-y,(p.h+2*m)*H);
  return w>20&&h>20?jpeg(img,360,.85,{x,y,w,h}):''}
async function readSheet(file){let img;
  try{img=await loadImg(file)}catch(e){return say(esc(e.message))}
  const small=jpeg(img,320,.7);
  panel(`<h2>Lecture de la fiche…</h2><div class="card"><div class="row"><img class="thumb big" src="${small}" alt=""><div class="meta">L’IA lit la photo. Comptez cinq à quinze secondes.</div></div></div>`);
  const retry=`<div class="acts"><button class="btn primary" type="button" data-act="fiche" data-id="cam">Reprendre la photo</button><button class="btn" type="button" data-act="add-stock-main">Saisir à la main</button>${closeBtn}</div>`;
  let res;
  try{const t=await token(),send=jpeg(img,1568,.85);
    const r=await fetch(SB.url+'/functions/v1/analyser-fiche',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},
      body:JSON.stringify({magasin:link.m,type:'image/jpeg',image:send.split(',')[1]})});
    res=await r.json().catch(()=>({ok:false,message:'Réponse illisible du serveur.'}))}
  catch(e){res={ok:false,message:e.net?'Pas de connexion : la lecture par IA a besoin d’internet.':e.message}}
  if(!res.ok)return panel(`<h2>Lecture impossible</h2><p>${esc(res.message||'Erreur inconnue.')}</p>${retry}`);
  const f=res.fiche;
  /* a model name is enough to start: the shopkeeper completes the rest (the brand is often missing on
     unbranded models sold under several names) */
  if(!f.name)return panel(`<h2>Fiche illisible</h2><p>${esc(f.remarque||'La photo ne montre pas de fiche produit exploitable.')}</p><p class="meta">Cadrez la fiche entière, à plat, avec une bonne lumière.</p>${retry}`);
  const same=S.stock.find(x=>x.kind===f.kind&&full(x).toLowerCase()===((f.brand+' '+f.name).trim()).toLowerCase());
  if(same)return panel(`<h2>Déjà dans votre stock</h2><p>${esc(full(same))} existe déjà.</p><div class="acts"><button class="btn primary" type="button" data-act="art" data-id="${same.id}">Ouvrir sa fiche</button>${closeBtn}</div>`);
  const spec={};Object.keys(SPEC).forEach(k=>{if(f[k])spec[k]=f[k]});
  const b={brand:f.brand,name:f.name,ref:f.ref,kind:f.kind,spec,war:f.war!=null?warSnap(f.war):12,sup:''};
  /* read on the photo, or inferred from the model: the shopkeeper must see which is which */
  const guess=new Set((f.deduit||[]).filter(k=>f[k])),doubt=new Set((f.incertain||[]).filter(k=>!guess.has(k)));
  if(!f.brand)doubt.add('brand');
  if(f.war!=null&&warSnap(f.war)!==f.war)doubt.add('war');
  const pic=cutOut(img,f.photo),src=jpeg(img,700,.6),n=guess.size+doubt.size;
  sheet('Vérifiez la fiche lue par l’IA',artFields(b).map(x=>guess.has(x.k)?{...x,l:x.l+' · déduit du modèle, à vérifier'}:doubt.has(x.k)?{...x,l:x.l+' · à vérifier'}:x),
   d=>{const r=artSave(d);r.img=pic;r.src={type:'ia',d:plus(0),img:src,...(guess.size?{deduit:[...guess]}:{})};showArt(r.id)},d=>artCheck(d));
  $('#form h2').insertAdjacentHTML('afterend',`<div class="card ${n?'warn':'ok'}"><div class="row">${pic?`<img class="thumb big" src="${pic}" alt="">`:''}<div class="meta">${esc(f.remarque||'')}${guess.size?'<br><b>'+guess.size+' caractéristique'+(guess.size>1?'s':'')+' déduite'+(guess.size>1?'s':'')+' du modèle</b>, pas lue'+(guess.size>1?'s':'')+' sur la photo.':''}${doubt.size?'<br><b>'+doubt.size+' champ'+(doubt.size>1?'s':'')+' à vérifier.</b>':''}${Object.keys(spec).length?'':'<br><b>Aucune caractéristique trouvée</b> : photographiez plutôt la page « Specifications » du manuel, ou l’étiquette sous le plateau.'}<br>Ajoutez le prix de vente, puis enregistrez.</div></div></div>`);
  const pr=$('#f-price');if(pr)pr.focus()}

  const m=d.slice(0,7);return [m+'-01',monthEnd(m),ref?m:'ce mois-ci']}

function prevPeriod(kind){const [f]=periodOf(kind),n=Math.round((new Date(plus(0)+'T00:00:00')-new Date(f+'T00:00:00'))/DAY);
  const pf=kind==='jour'?addDays(f,-1):kind==='semaine'?addDays(f,-7):(()=>{const x=new Date(f+'T00:00:00');x.setMonth(x.getMonth()-1);return iso(x)})();

 'clo-p'(k){cloP=k;render()},
 rapport(id){if(!isP())return say('Les rapports sont réservés au patron.');const [f,t]=String(id).split('|');
  paper={name:'cloture-'+f+(t!==f?'-'+t:''),fmt:'a4'};panel(reportHtml(f,t)+printBar()+`<div class="acts">${closeBtn}</div>`)},
 /* the seller counts without seeing what is expected: a blind count tells the truth */
 caisse(){const d0=plus(0);
  sheet('Compter la caisse',[{k:'counted',l:'Argent compté dans la caisse (DH)',t:'number'},{k:'left',l:'Laissé dans la caisse pour demain (DH)',t:'number',v:0}],
   d=>{const c=countCash(S,d0,n(d.counted),n(d.left),auth?auth.user.email:(isP()?'patron':'vendeur'));
    setTimeout(()=>isP()?say(`Caisse comptée : ${dh(c.counted)} pour ${dh(c.expectedAtCount)} attendus · <b class="${c.ecart?'neg':''}">écart ${c.ecart>0?'+':''}${dh(c.ecart)}</b>. ${dh(c.counted-c.left)} retirés, ${dh(c.left)} laissés pour demain.`):say('Comptage enregistré. Merci.'),0)},
   d=>n(d.left)>n(d.counted)?'Le fond laissé ne peut pas dépasser l’argent compté.':'')}
});
/* midnight: yesterday closes. Online, the closing waits for the server's data (another phone may have counted). */
let dayNow=plus(0);
function closeDays(){if(autoClose(S)){save();render()}}
setInterval(()=>{if(plus(0)!==dayNow){dayNow=plus(0);if(online())syncLater(200);else closeDays()}},60000);
if(!online())closeDays();

/* ---------- réception par photo du bon d'achat : l'IA lit, le commerçant vérifie chaque ligne ---------- */
let lastBon=null;
const norm=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');
const digits=v=>String(v||'').replace(/\D/g,'').replace(/^212/,'0');
function bonLeft(){return !!(lastBon&&lastBon.lignes.some(l=>!l.fait))}
function bonReceived(b,r){const x=S.buys[S.buys.length-1];if(x&&x.ref===r.id){x.bon=b.no;if(b.garantie)x.garFour=b.garantie}
  if(lastBon&&lastBon.lignes[b.i]){lastBon.lignes[b.i].fait=true;lastBon.lignes[b.i].art=r.id}}
/* the same supplier and the same article, even written a little differently */
function matchSup(f){const nm=norm(f.nom),ph=digits(f.telephone);
  return S.sups.find(x=>(nm&&norm(x.name)===nm)||(ph.length>=9&&digits(x.phone)===ph))||S.sups.find(x=>nm&&(norm(x.name).includes(nm)||nm.includes(norm(x.name))))}
function matchArt(l){const m=norm(l.modele),full2=norm((l.marque||'')+l.modele);if(!m)return null;
  return S.stock.find(r=>r.kind===l.kind&&(norm(full(r))===full2||norm(r.name)===m))
    ||S.stock.find(r=>r.kind===l.kind&&norm(r.name).length>=2&&(m.includes(norm(r.name))||norm(full(r)).includes(m)))}
async function askAI(img,mode){const t=await token(),send=jpeg(img,1568,.85);
  const r=await fetch(SB.url+'/functions/v1/analyser-fiche',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json'},
    body:JSON.stringify({magasin:link.m,mode,type:'image/jpeg',image:send.split(',')[1]})});
  return r.json().catch(()=>({ok:false,message:'Réponse illisible du serveur.'}))}
async function readBon(file){let img;
  try{img=await loadImg(file)}catch(e){return say(esc(e.message))}
  panel(`<h2>Lecture du bon d’achat…</h2><div class="card"><div class="row"><img class="thumb big" src="${jpeg(img,320,.7)}" alt=""><div class="meta">L’IA lit le document. Comptez cinq à quinze secondes.</div></div></div>`);
  const retry=`<div class="acts"><button class="btn primary" type="button" data-act="bon" data-id="cam">Reprendre la photo</button><button class="btn" type="button" data-act="recv-main">Saisir à la main</button>${closeBtn}</div>`;
  let res;try{res=await askAI(img,'achat')}catch(e){res={ok:false,message:e.net?'Pas de connexion : la lecture par IA a besoin d’internet.':e.message}}
  if(!res.ok)return panel(`<h2>Lecture impossible</h2><p>${esc(res.message||'Erreur inconnue.')}</p>${retry}`);
  const b=res.fiche;
  if(!b.lisible||!(b.lignes||[]).length)return panel(`<h2>Bon illisible</h2><p>${esc(b.remarque||'La photo ne montre pas de bon d’achat exploitable.')}</p><p class="meta">Cadrez le document entier, à plat, avec une bonne lumière.</p>${retry}`);
  const sup=matchSup(b.fournisseur),d=isDay(b.date)&&days(b.date)<=0?b.date:'';
  lastBon={...b,supId:sup?sup.id:'',d,lignes:b.lignes.map(l=>{const r=matchArt(l);
    return {...l,art:r?r.id:'',fait:!!(r&&b.numero&&S.buys.some(x=>x.bon===b.numero&&x.ref===r.id))}})};
  showBon()}
function showBon(){const b=lastBon,sup=supOf(S,b.supId),doubt=new Set(b.incertain||[]),w=k=>doubt.has(k)?' <span class="neg">à vérifier</span>':'';
  panel(`<h2>Bon d’achat lu</h2>
  <div class="card ${sup?'ok':'warn'}"><div class="row"><div><div class="name">${esc(b.fournisseur.nom||'Fournisseur non lu')}${w('fournisseur')}</div>
   <div class="meta">${esc([b.fournisseur.telephone,b.fournisseur.ville].filter(Boolean).join(' · '))}</div>
   <div class="meta">${sup?'Fournisseur déjà connu.':'Nouveau fournisseur : il sera créé à la première ligne.'}</div></div></div>
   <div class="meta">${b.d?'Daté du '+fdate(b.d):'Date non lue : celle du jour sera proposée'}${w('date')} · ${b.numero?'bon '+esc(b.numero):'sans numéro'}${w('numero')} · ${b.paiement==='du'?'à payer':b.paiement==='paye'?'payé':'paiement non indiqué'}${w('paiement')}${b.garantie_mois?' · garantie fournisseur '+b.garantie_mois+' mois':''}</div>
   ${b.remarque?`<div class="meta">${esc(b.remarque)}</div>`:''}</div>
  ${b.lignes.map((l,i)=>{const r=refOf(S,l.art);return `<div class="card ${l.fait?'ok':''}"><div class="row"><div><div class="name">${esc(l.designation)}</div>
    <div class="meta">${l.quantite} × ${dh(l.prix_unitaire)}${w('prix')} · ${r?'article : '+esc(full(r)):'nouvel article à créer'}</div></div>
    ${l.fait?'<span class="pill ok">Reçu</span>':`<button class="btn primary" type="button" data-act="bon-ligne" data-id="${i}">Réceptionner</button>`}</div></div>`}).join('')}
  <div class="acts">${closeBtn}</div>`)}
['cam','img'].forEach(k=>$('#bon-'+k).addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)readBon(f)}));
Object.assign(acts,{
 bon(k){closeSheet();if(!online())return say('Connectez-vous dans Réglages, Compte en ligne, pour utiliser la lecture par IA.');$('#bon-'+(k==='img'?'img':'cam')).click()},
 'bon-voir'(){if(lastBon)showBon()},
 'bon-ligne'(i){const b=lastBon,l=b&&b.lignes[i];if(!l)return;
  /* no stock without a supplier: an unknown supplier is created first, from what the document says */
  if(!supOf(S,b.supId))return newSup(nf=>{b.supId=nf.id;acts['bon-ligne'](i)},
    {name:b.fournisseur.nom,phone:digits(b.fournisseur.telephone),city:b.fournisseur.ville,note:b.garantie_mois?'Garantie '+b.garantie_mois+' mois':''});
  const pre={sup:b.supId,qty:Math.max(1,Math.min(R.maxQty,l.quantite||1)),cost:l.prix_unitaire||'',
    etat:b.paiement==='du'?'du':'paye',d:b.d||plus(0),bon:{no:b.numero,garantie:b.garantie_mois||0,i:Number(i)}};
  if(refOf(S,l.art))return acts['recv-main'](null,null,{...pre,art:l.art});
  /* a new article: its card first (the sale price is the shopkeeper's), then the reception, already filled */
  sheet('Nouvel article · '+esc(l.designation),artFields({brand:l.marque,name:l.modele,kind:l.kind,war:b.garantie_mois?warSnap(b.garantie_mois):12,cost:l.prix_unitaire||'',sup:b.supId,spec:{}}),
   x=>{const r=artSave(x);l.art=r.id;acts['recv-main'](null,null,{...pre,art:r.id})},x=>artCheck(x));
  $('#form h2').insertAdjacentHTML('afterend','<p class="meta">Lu sur le bon : '+esc(l.designation)+'. Ajoutez le prix de vente ; la réception suit.</p>');
  const pr=$('#f-price');if(pr)pr.focus()}
});

applyRole();
if(online())syncLater(300);

document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');
  if(v){view[v.dataset.view]=Number(v.dataset.i);render();return}
  const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act](b.dataset.id,b)});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.change;
  if(k==='lead'){const l=find('leads',t.dataset.id);l.status=t.value;l.last=plus(0);upd()}
  if(k==='del'){setDel(S,t.dataset.id,t.value);upd()}
  if(k==='jm'){jm=t.value;render()}
  if(k==='shop'){S.shop=t.value.trim()||'Ma boutique';upd()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;render(true)}});
try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{if(d){DL=d;render()}},()=>{})}catch(e){}
if(SOLO&&'serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function fromLink(){const x=location.hash.slice(1);
  if(!/^qr-/i.test(x))return false;
  const key=x.slice(3);location.hash='#accueil';
  setTimeout(()=>runCode('DAFTAR:A:'+key),60);return true}
addEventListener('hashchange',()=>{if(fromLink())return;render();scrollTo(0,0)});
render();fromLink();
}
